name: Native display pilot checks

on:
  pull_request:
    paths:
      - 'pilots/native-display/**'
      - '.github/workflows/native-display-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source
        run: git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install public Android SDK
        # Hosted runners already have the Android SDK/core license. Do not accept new licenses.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "platforms;android-36" "build-tools;36.0.0" </dev/null'
      - name: Lint, JVM and Android 9 simulated-runtime tests, unsigned build
        run: ./gradlew -p pilots/native-display :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify and report executed tests
        run: |
          python3 - <<'PYTEST'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          reports = pathlib.Path("pilots/native-display/app/build/test-results/testDebugUnitTest")
          suites = []
          for path in sorted(reports.glob("TEST-*.xml")):
              root = ET.parse(path).getroot()
              suites.append({"name": root.attrib["name"], **{
                  key: int(root.attrib.get(key, 0)) for key in ("tests", "skipped", "failures", "errors")}})
          assert any(s["name"].endswith("PilotActivityRuntimeTest") and s["tests"] > 0 for s in suites)
          assert any(s["name"].endswith("PilotSessionTest") and s["tests"] > 0 for s in suites)
          assert all(s["skipped"] == s["failures"] == s["errors"] == 0 for s in suites)
          result = {"suites": suites, "total_tests": sum(s["tests"] for s in suites)}
          print(json.dumps(result, indent=2))
          pathlib.Path("pilots/native-display/app/build/pilot-tests.txt").write_text(json.dumps(result, indent=2))
          PYTEST
      - name: Inspect standalone artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=pilots/native-display/app/build/outputs/apk/debug/app-debug-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee pilots/native-display/app/build/pilot-badging.txt
          if grep -q 'uses-permission:' pilots/native-display/app/build/pilot-badging.txt; then
            echo 'FAIL: standalone pilot must not request any permission'; exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo 'FAIL: build must not silently generate or use a signing key'; exit 1
          fi
          sha256sum "$APK" | tee pilots/native-display/app/build/pilot-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-display-pilot-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pilots/native-display/app/build/outputs/apk/debug/*unsigned.apk
            pilots/native-display/app/build/reports/
            pilots/native-display/app/build/test-results/
            pilots/native-display/app/build/pilot-*.txt
          retention-days: 14
