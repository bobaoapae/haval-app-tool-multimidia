name: Virtual cluster toggle regression

on:
  pull_request:
    paths:
      - '.github/workflows/virtual-cluster-toggle.yml'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/managers/ProjectorManager.java'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/managers/DisplayAppLauncher.kt'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/projectors/InstrumentProjector2.kt'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/ui/screens/TelasScreen.kt'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/utils/VirtualClusterPreferences.java'
      - 'app/src/main/java/br/com/redesurftank/havalshisuku/diagnostics/AnonymousTelemetryCollector.kt'
      - 'scripts/virtual-cluster-tests/**'
      - 'cluster-widgets/**'
      - 'app/src/main/res/raw/app.html'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host lifecycle regression (Android fakes)
        run: python3 -m unittest discover -s scripts/virtual-cluster-tests -v
      - name: Theme regression checks
        working-directory: cluster-widgets
        run: npm run check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and unit tests (debug only)
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
