<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Minimalist background preview</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: Segoe UI, sans-serif; }
  h1 { margin: 16px 24px 8px; font-size: 20px; }
  h2 { margin: 24px 24px 8px; font-size: 16px; color: #ccc; }
  img { display: block; width: calc(100% - 48px); margin: 0 24px 8px; background: #000; }
  p { margin: 0 24px 16px; color: #888; font-size: 13px; }
</style>
</head>
<body>
  <h1>Minimalist background preview</h1>
  <h2>1. Current (two lines)</h2>
  <img src="01-current.png" alt="Current">
  <h2>2. Suggested (keep center-top, smooth center-bottom)</h2>
  <img src="02-suggested.png" alt="Suggested">
  <h2>3. Side by side</h2>
  <img src="03-side-by-side.png" alt="Compare">
  <h2>4. Center zoom</h2>
  <img src="04-center-zoom.png" alt="Zoom">
</body>
</html>
